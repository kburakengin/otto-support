<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Otto</title>

<!--
  Redirect to the App Store, carrying a campaign token.

  Why this page exists: Meta rejects apps.apple.com links in a Traffic campaign
  ("App Url is only supported by App Installs objective"), and the apple.co short
  link drops query parameters. Without a token, App Store Connect cannot tell an
  ad-driven download from an organic one — which is the whole question an ad test
  is meant to answer.

  The campaign defaults to the current ad but can be overridden per link:
      go.html            -> ct=meta-tr-aug
      go.html?c=reddit   -> ct=reddit
  so future campaigns don't need another commit.
-->

<script>
  var APP_ID = "6790812327";
  var params = new URLSearchParams(location.search);
  // Keep the token short and alphanumeric; Apple truncates long campaign values.
  var campaign = (params.get("c") || "meta-tr-aug").replace(/[^a-zA-Z0-9._-]/g, "").slice(0, 40);
  var target = "https://apps.apple.com/tr/app/id" + APP_ID + "?ct=" + campaign + "&mt=8";
  // replace() rather than href: the redirect shouldn't sit in the back stack,
  // or "back" from the App Store lands here and bounces the visitor again.
  location.replace(target);
</script>

<!-- Fallback for anyone with JavaScript disabled. -->
<noscript>
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/tr/app/id6790812327?ct=meta-tr-aug&amp;mt=8">
</noscript>

<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b1026; color: #f2f4fa;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    text-align: center; padding: 24px;
  }
  a { color: #ff9f0a; }
</style>
</head>
<body>
  <!-- Shown only if both the script and the refresh fail. -->
  <p>
    App Store'a yönlendiriliyorsun…<br>
    <a href="https://apps.apple.com/tr/app/id6790812327?ct=meta-tr-aug&amp;mt=8">Otto Car Dashboard</a>
  </p>
</body>
</html>
